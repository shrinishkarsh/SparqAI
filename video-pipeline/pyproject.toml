[project]
name = "sparqai-video-pipeline"
version = "0.1.0"
description = "Video editing pipeline helpers for SparqAI"
requires-python = ">=3.11"

dependencies = [
    "requests>=2.31.0",
    "librosa>=0.10.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
